# Reverse proxy optionnel de docker-compose.app.yml (profil "production").
# Il est le point d'entrée public de la stack : il relaie vers les services
# `frontend` (nginx du conteneur web, port 80) et `backend` (Express, port 3001)
# par leur nom de service sur le réseau Docker `teachdigital-network`.
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Taille maximale des uploads (alignée avec la limite d'upload du backend : 25 Mo)
    client_max_body_size 25m;
    # Buffer mémoire pour les uploads (évite l'écriture sur disque temporaire)
    client_body_buffer_size 25m;

    # HTTP Server (redirige vers HTTPS en production)
    server {
        listen 80;
        server_name _;

        # Redirection vers HTTPS (décommente en production avec SSL)
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            # Ce proxy est le premier saut : on transmet l'IP de la connexion TCP,
            # jamais un X-Forwarded-For fourni par le client.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /api/ {
            proxy_pass http://backend:3001/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts pour les opérations IA longues (génération de quiz avec 20 questions)
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            send_timeout 600s;
        }
    }

    # HTTPS Server (décommente et configure en production, puis publie 443 dans
    # docker-compose.app.yml et monte les certificats dans ./ssl)
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name your-domain.example;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #
    #     location / {
    #         proxy_pass http://frontend:80;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection 'upgrade';
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $remote_addr;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_cache_bypass $http_upgrade;
    #     }
    #
    #     location /api/ {
    #         proxy_pass http://backend:3001/;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $remote_addr;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
