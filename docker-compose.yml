version: "3.8"

# ============================================================================
# Stack Supabase OPTIONNELLE (expérimentale, non utilisée par l'application).
# L'application TeachDigital tourne avec backend/docker-compose.yml +
# docker-compose.frontend.yml (cf. deploy.ps1) ou docker-compose.app.yml.
#
# - Tous les secrets viennent de l'environnement / d'un fichier .env (non commité) :
#     POSTGRES_PASSWORD, AUTHENTICATOR_PASSWORD, SUPABASE_JWT_SECRET,
#     SUPABASE_ANON_KEY, SUPABASE_SERVICE_KEY (JWT signés avec SUPABASE_JWT_SECRET).
#   Les mots de passe sont utilisés dans des URL postgres:// : éviter les caractères
#   spéciaux (ou les encoder) — ex. openssl rand -hex 24.
# - Tous les ports sont liés à 127.0.0.1 (Studio et l'API d'admin n'ont pas d'auth).
# - Kong attend un fichier ./kong.yml (non fourni dans ce dépôt).
# - Initialisation des rôles : cf. init-supabase.sql et doc/README-SUPABASE.md.
# ============================================================================

services:
  db:
    image: supabase/postgres:15.1.0.147
    container_name: supabase-db
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST: /var/run/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  studio:
    image: supabase/studio:20231214-2be3a89
    container_name: supabase-studio
    restart: always
    ports:
      # Studio n'a pas d'authentification : jamais exposé hors de l'hôte
      - "127.0.0.1:8080:3000"
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY must be set}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY must be set}
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_started
      meta:
        condition: service_started

  rest:
    image: postgrest/postgrest:v11.2.0
    container_name: supabase-rest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?AUTHENTICATOR_PASSWORD must be set}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET must be set}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET must be set}
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    ports:
      # 3005 (et non 3001) pour ne pas entrer en conflit avec le backend TeachDigital
      - "127.0.0.1:3005:3000"

  meta:
    image: supabase/postgres-meta:v0.79.0
    container_name: supabase-meta
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:8081:8080"

  kong:
    image: kong:2.8.1
    container_name: supabase-kong
    restart: always
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./kong.yml:/usr/local/kong/kong.yml:ro
    depends_on:
      - rest
      - meta

  auth:
    image: supabase/gotrue:v2.99.0
    container_name: supabase-auth
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/postgres
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-http://localhost:8080}
      # Liste explicite des URL de redirection autorisées (plus de "*")
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-http://localhost:8080}
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-true}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET must be set}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Pas de confirmation automatique des e-mails par défaut
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-false}
    ports:
      - "127.0.0.1:9999:9999"

volumes:
  db_data:
