version: '3.8'

# Stack "tout-en-un" (PostgreSQL + backend + frontend [+ reverse proxy optionnel]).
# Ce n'est PAS le chemin de déploiement Synology actuel (cf. deploy.ps1 qui utilise
# backend/docker-compose.yml et docker-compose.frontend.yml).
#
# Variables requises (fichier .env à côté de ce compose, jamais commité) :
#   POSTGRES_PASSWORD, JWT_SECRET (>= 32 caractères aléatoires : openssl rand -hex 32)
# Usage : docker compose -f docker-compose.app.yml up -d --build
#         docker compose -f docker-compose.app.yml --profile production up -d   # + reverse proxy nginx

services:
  # Base de données PostgreSQL pour l'application
  postgres:
    image: postgres:16-alpine
    container_name: teachdigital-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teachdigital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-teachdigital}
    ports:
      # Accessible uniquement depuis l'hôte (le backend passe par le réseau Docker)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - teachdigital-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teachdigital}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend API (Node.js) — image construite, pas de bind-mount du code source
  # (pour du développement avec rechargement, utiliser `pnpm dev` dans backend/).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teachdigital-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-teachdigital}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-teachdigital}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 32)}
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      # Publié sur l'hôte : nginx-frontend.conf (conteneur frontend) relaie /api/
      # vers host.docker.internal:3001.
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - teachdigital-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Vue.js + Nginx). Les variables VITE_* sont injectées AU BUILD (pas au runtime).
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL_PROD: ${VITE_API_URL_PROD:-}
    container_name: teachdigital-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - teachdigital-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (optionnel - pour production)
  # nginx.conf écoute sur 80 et relaie vers les services `frontend` et `backend`.
  # Pour HTTPS : activer le bloc 443 de nginx.conf, monter ./ssl et publier "443:443".
  nginx:
    image: nginx:alpine
    container_name: teachdigital-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./ssl:/etc/nginx/ssl:ro  # Pour les certificats SSL (bloc 443)
    depends_on:
      - frontend
      - backend
    networks:
      - teachdigital-network
    profiles:
      - production  # Ne démarre que si on utilise le profile production

volumes:
  postgres_data:
    driver: local

networks:
  teachdigital-network:
    driver: bridge
