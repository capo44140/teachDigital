name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Réutilisé comme garde-fou par deploy-synology.yml
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, tests unitaires, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Version de pnpm lue depuis frontend/package.json ("packageManager") : à installer
      # AVANT setup-node pour que le cache pnpm fonctionne.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  backend:
    name: Backend (tests Jest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # Base dédiée aux tests : le schéma est créé par tests/schema.sql
    # (aucune donnée de production n'est utilisée).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teachdigital
          POSTGRES_PASSWORD: teachdigital
          POSTGRES_DB: teachdigital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teachdigital -d teachdigital_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://teachdigital:teachdigital@localhost:5432/teachdigital_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialiser le schéma de test
        run: pnpm run test:db:init

      - name: Tests (unitaires + intégration DB)
        # --runInBand : une seule suite à la fois sur la même base de test
        run: pnpm test -- --runInBand
        env:
          CI: true
