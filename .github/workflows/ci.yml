name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Réutilisé comme garde-fou par deploy-synology.yml
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, tests unitaires, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version de pnpm lue depuis package.json ("packageManager") : à installer
      # AVANT setup-node pour que le cache pnpm fonctionne.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  backend:
    name: Backend (tests Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Aucune base de données n'est fournie : les tests d'intégration DB sont
      # ignorés tant que TEST_DATABASE_URL n'est pas défini.
      - name: Tests
        run: pnpm test
        env:
          CI: true
