name: Tests End-to-End

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # pnpm doit être installé AVANT setup-node (cache: pnpm) ; la version est lue
      # depuis frontend/package.json ("packageManager": pnpm 9.15.x, lockfile v9).
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Seul navigateur utilisé par playwright.config.js (projets « chromium » et « mobile »)
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Serveur de développement Vite lancé par Playwright (webServer), API simulée par page.route :
      # ni build ni backend nécessaires
      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 30
