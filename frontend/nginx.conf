# Configuration nginx du conteneur frontend (Dockerfile / Dockerfile.prebuilt, dans frontend/).
# Le conteneur écoute sur 80 ; l'hôte publie 3000 -> 80 (frontend/docker-compose.yml / docker-compose.app.yml).

# --- Politique de sécurité du contenu (CSP) ------------------------------------
# Deux politiques :
# - l'application (scripts uniquement servis par l'app, pas d'inline) ;
# - /course-page/* : les pages HTML générées par l'IA embarquent leur propre CSS/JS
#   inline (iframe sandboxée sans allow-same-origin) et peuvent charger Google Fonts.
#   On y autorise donc 'unsafe-inline' pour les scripts, uniquement sur cette route.
# Tous les en-têtes sont posés au niveau « server » : les blocs « location » ne
# doivent pas redéfinir add_header, sinon ils perdraient ces en-têtes (règle nginx :
# un location qui déclare add_header n'hérite plus de ceux du serveur).
# $request_uri (et non $uri) : try_files fait une redirection interne vers
# /index.html, qui ferait perdre l'URL d'origine.
map $request_uri $csp_policy {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.youtube.com https://i.ytimg.com https://www.youtube.com https://api.iconify.design; font-src 'self' data:; connect-src 'self' https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; media-src 'self' blob: https://www.youtube.com https://www.youtube-nocookie.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'";
    ~^/course-page(-manager)?(/|\?|$) "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; media-src 'self' blob: data:; frame-src 'self'; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'";
}

# --- Cache-Control (une seule directive add_header, héritée partout) -----------
# Les anciens blocs « location » utilisaient add_header/expires : ils empêchaient
# l'héritage des en-têtes de sécurité. Tout est centralisé ici.
map $uri $cache_control {
    default "no-cache, no-store, must-revalidate";

    # Fichiers de version / service worker : toujours revalidés
    /sw.js "no-cache, no-store, must-revalidate";
    /version.json "no-cache, no-store, must-revalidate";
    /manifest.json "no-cache";
    /manifest.webmanifest "no-cache";

    # Assets fingerprintés par Vite (hash dans le nom) -> cache long
    ~^/assets/ "public, max-age=31536000, immutable";

    # Autres fichiers statiques (icônes, favicons...) : noms non garantis uniques
    ~*\.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot)$ "public, max-age=604800";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas exposer la version de nginx
    server_tokens off;

    # En-têtes de sécurité (appliqués à toutes les réponses, y compris les erreurs)
    add_header Content-Security-Policy $csp_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;

    # Taille maximale des uploads (alignée avec la limite d'upload du backend : 25 Mo)
    client_max_body_size 25m;
    # Buffer mémoire pour les uploads (évite l'écriture sur disque temporaire)
    client_body_buffer_size 25m;

    # IP client réelle : on ne fait confiance à X-Forwarded-For que s'il est posé par un
    # proxy du réseau privé (reverse proxy DSM, passerelle Docker, LAN). Un client
    # Internet qui forge l'en-tête directement n'est donc pas cru.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript application/manifest+json;

    # --- Fichiers qui ne doivent jamais être mis en cache -----------------------
    # (le Cache-Control est défini par la map ci-dessus)
    location = /sw.js {
        try_files $uri =404;
    }

    location = /version.json {
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /manifest.json {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    # --- Assets fingerprintés par Vite (hash dans le nom) -> cache long ----------
    location /assets/ {
        try_files $uri =404;
    }

    # Autres fichiers statiques (icônes, favicons...) : cache plus court
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
    }

    # Toutes les autres requêtes vers index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend API (publié sur le port 3001 de l'hôte)
    location /api/ {
        proxy_pass http://host.docker.internal:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr = IP client réelle (cf. real_ip ci-dessus). On n'ajoute PAS
        # l'en-tête X-Forwarded-For reçu du client ($proxy_add_x_forwarded_for).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Timeouts pour les opérations IA longues (génération de quiz avec 20 questions)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}
