# Configuration nginx du conteneur frontend (Dockerfile / Dockerfile.prebuilt, dans frontend/).
# Le conteneur écoute sur 80 ; l'hôte publie 3000 -> 80 (frontend/docker-compose.yml / docker-compose.app.yml).

# --- Politique de sécurité du contenu (CSP) ------------------------------------
# Une seule politique stricte pour toute l'application (scripts servis par l'app,
# aucun script inline), y compris les pages qui affichent les pages de cours.
# Exception : /api/course-pages/render sert le HTML des pages de cours (quiz en
# JavaScript inline) avec sa propre CSP, posée par le backend (directive « sandbox »,
# cf. backend/lib/coursePageView.js). nginx n'y ajoute rien (valeur vide = en-tête
# non envoyé) : deux CSP s'additionneraient et bloqueraient la page.
# Tous les en-têtes sont posés au niveau « server » : les blocs « location » ne
# doivent pas redéfinir add_header, sinon ils perdraient ces en-têtes (règle nginx :
# un location qui déclare add_header n'hérite plus de ceux du serveur).
# $request_uri (et non $uri) : try_files fait une redirection interne vers
# /index.html, qui ferait perdre l'URL d'origine.
map $request_uri $csp_policy {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.youtube.com https://i.ytimg.com https://www.youtube.com; font-src 'self' data:; connect-src 'self'; media-src 'self' blob: https://www.youtube.com https://www.youtube-nocookie.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'";
    ~^/api/course-pages/render(\?|$) "";
}

# --- Cache-Control (une seule directive add_header, héritée partout) -----------
# Les anciens blocs « location » utilisaient add_header/expires : ils empêchaient
# l'héritage des en-têtes de sécurité. Tout est centralisé ici.
map $uri $cache_control {
    default "no-cache, no-store, must-revalidate";

    # Fichiers de version / service worker : toujours revalidés
    /sw.js "no-cache, no-store, must-revalidate";
    /version.json "no-cache, no-store, must-revalidate";
    /manifest.json "no-cache";
    /manifest.webmanifest "no-cache";
    # Script de thème de index.html : nom fixe, revalidé à chaque chargement
    /theme-boot.js "no-cache";

    # Assets fingerprintés par Vite (hash dans le nom) -> cache long
    ~^/assets/ "public, max-age=31536000, immutable";

    # Autres fichiers statiques (icônes, favicons...) : noms non garantis uniques
    ~*\.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot)$ "public, max-age=604800";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas exposer la version de nginx
    server_tokens off;

    # En-têtes de sécurité (appliqués à toutes les réponses, y compris les erreurs)
    add_header Content-Security-Policy $csp_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;

    # Taille maximale des uploads (alignée avec la limite d'upload du backend : 25 Mo)
    client_max_body_size 25m;
    # Buffer mémoire pour les uploads (évite l'écriture sur disque temporaire)
    client_body_buffer_size 25m;

    # IP client réelle : X-Forwarded-For n'est cru que s'il est posé par le reverse proxy
    # DSM du NAS, qui joint ce conteneur par la passerelle Docker (127.0.0.1 ou 172.16/12 :
    # réseau « teachdigital », sous-réseau fixé par deploy.ps1 -DockerSubnet).
    # Le réseau local (192.168/16, 10/8) n'est PAS de confiance : avec real_ip_recursive,
    # nginx retient la dernière adresse non fiable de la chaîne, c'est-à-dire l'IP ajoutée
    # par le reverse proxy, et non une valeur forgée par le client (verrouillage par IP).
    # Si le reverse proxy DSM vise l'IP réseau du NAS (et non localhost:3000), déclarer
    # cette IP dans NGINX_TRUSTED_PROXY (frontend/docker-compose.yml), sinon toutes les
    # requêtes semblent venir du NAS. Si le réseau local utilise lui-même 172.16/12,
    # publier le port 3000 sur 127.0.0.1 seulement (FRONTEND_BIND_ADDRESS) et faire
    # pointer le reverse proxy DSM vers localhost:3000.
    # Ce fichier est un modèle : l'image nginx remplace ${NGINX_*} au démarrage
    # (/etc/nginx/templates, cf. Dockerfile.prebuilt).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from ${NGINX_TRUSTED_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript application/manifest+json;

    # --- Fichiers qui ne doivent jamais être mis en cache -----------------------
    # (le Cache-Control est défini par la map ci-dessus)
    location = /sw.js {
        try_files $uri =404;
    }

    location = /version.json {
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /manifest.json {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    # Manifeste de build Vite (lu par scripts/generate-sw.js) : inutile en production
    location ^~ /.vite/ {
        return 404;
    }

    # --- Assets fingerprintés par Vite (hash dans le nom) -> cache long ----------
    location /assets/ {
        try_files $uri =404;
    }

    # Autres fichiers statiques (icônes, favicons...) : cache plus court
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
    }

    # Toutes les autres requêtes vers index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend API : conteneur « backend » du réseau Docker « teachdigital »
    # (cf. frontend/docker-compose.yml et backend/docker-compose.yml). /api/x est relayé en /x.
    location /api/ {
        # Résolution par le DNS interne de Docker à chaque requête (cache 10 s) : l'IP du
        # conteneur backend change à chaque redéploiement, et nginx démarre même si le
        # backend n'est pas encore lancé (redémarrage du NAS).
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $teachdigital_backend http://backend:3001;
        # proxy_pass avec une variable : le préfixe /api est retiré par la réécriture
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $teachdigital_backend;
        proxy_http_version 1.1;
        # Identifiant de requête repris par le backend (logs, en-tête X-Request-Id des réponses)
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        # $remote_addr = IP client réelle (cf. real_ip ci-dessus). On n'ajoute PAS
        # l'en-tête X-Forwarded-For reçu du client ($proxy_add_x_forwarded_for).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Timeouts pour les opérations IA longues (génération de quiz avec 20 questions)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}
