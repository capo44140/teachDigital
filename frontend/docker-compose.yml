version: '3.8'

# Stack frontend déployée sur le Synology par ../deploy.ps1.
# Sur le NAS : dist/, nginx.conf, Dockerfile.prebuilt et ce fichier sont copiés tels quels.
# Utilisable aussi en local : cd frontend && pnpm run build && docker compose up -d --build
# (le réseau « teachdigital » doit exister : docker network create teachdigital).
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    container_name: teachdigital-frontend
    restart: unless-stopped
    ports:
      # Hôte 3000 (cible du reverse proxy DSM) -> nginx du conteneur sur 80.
      # FRONTEND_BIND_ADDRESS=127.0.0.1 (recommandé si le reverse proxy DSM vise localhost:3000) :
      # les postes du réseau local passent alors forcément par le reverse proxy.
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:3000:80"
    environment:
      - NODE_ENV=production
      # IP du reverse proxy DSM s'il vise l'IP réseau du NAS au lieu de localhost:3000
      # (seul proxy autorisé à transmettre l'IP client, cf. nginx.conf)
      - NGINX_TRUSTED_PROXY=${NGINX_TRUSTED_PROXY:-127.0.0.1}
    # nginx.conf relaie /api/ vers http://backend:3001 (conteneur backend sur ce réseau)
    networks:
      - teachdigital
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3

# Réseau partagé avec le backend (créé par deploy.ps1 : docker network create teachdigital)
networks:
  teachdigital:
    external: true
    name: teachdigital
