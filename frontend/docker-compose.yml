version: '3.8'

# Stack frontend déployée sur le Synology par ../deploy.ps1 / ../deploy-frontend.ps1.
# Sur le NAS : dist/, nginx.conf, Dockerfile.prebuilt et ce fichier sont copiés tels quels.
# Utilisable aussi en local : cd frontend && pnpm run build && docker compose up -d --build
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    container_name: teachdigital-frontend
    restart: unless-stopped
    ports:
      # Hôte 3000 (cible du reverse proxy DSM) -> nginx du conteneur sur 80
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      # nginx.conf relaie /api/ vers le backend publié sur le port 3001 de l'hôte
      - "host.docker.internal:host-gateway"
